<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-lang-key="title"></title>

  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/swiper-bundle.min.css" />
</head>

<style>
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -1;
    pointer-events: none;
  }

  .click {
    position: absolute;
    bottom: 5vw;
    left: 50%;
    transform: translateX(-50%) scale(1);
    background-color: #FFDE72;
    padding: 0.2vw 2vw;
    font-family: "BalooDa";
    transition: transform 0.2s ease-in, background 0.2s ease-in, border 0.2s ease-in;
    text-decoration: none;
    z-index: 99999;
     border: 0.3vw solid #f38c1d95; 
     border-radius: 3vw;
     text-shadow: 0.2vw 0.2vw o.3vw rgba(0, 0, 0, 0.49);
     font-size: 2vw ;
     color: white;
  }

  .click:hover {
    background-color: #f38c1d;
    transform: translateX(-50%) scale(0.98);
    cursor: pointer;
    border: 0.3vw solid #FFDE72;
  }

</style>

<body>

  <video class="bg-video" src="./assets/videos/bg.mp4" autoplay muted loop playsinline preload="auto"></video>

  <span class="title" data-lang-key="title"></span>

  <a href="what-is-gratitude.html" class="click" data-lang-key="click"></a>

  <div class="language-container">
    <div class="english active">E</div>
    <div class="hindi">H</div>
    <div class="gujrati">G</div>
  </div>


  <!-- Click Audio -->
  <audio id="clickAudio" preload="auto">
    <source src="./assets/audio/click.mp3" type="audio/mpeg">
  </audio>

  <script src="./assets/js/swiper-bundle.min.js"></script>
    <script src="./assets/js/data.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/djp.js"></script>
  <script>
    const clickBtn = document.querySelector(".click");
    const clickAudio = document.getElementById("clickAudio");

    clickBtn.addEventListener("click", function (e) {
      e.preventDefault(); // Prevent immediate navigation

      clickAudio.currentTime = 0;
      clickAudio.play().catch(() => { });

      // Navigate after audio finishes (or after a short delay if playback fails)
      const goNext = () => {
        window.location.href = clickBtn.href;
      };

      clickAudio.onended = goNext;

      setTimeout(() => {
        if (document.visibilityState === "visible") {
          goNext();
        }
      }, 1500); // Fallback timeout
    });
  </script>

</body>

</html>
