            height: 100%;

            overflow: hidden;
        }

        .grateful-swiper {

        .grateful-swiper>.swiper-wrapper {

            height: 90%;

            user-select: none;
            -webkit-user-select: none;

        /* ========================================

        ======================================== */

        .cloud-video-wrapper {
            position: relative;

            width: 100%;
            aspect-ratio: 1.3 / 1;

            display: flex;
            align-items: center;
            justify-content: center;

            filter: drop-shadow(0 0.45vw 0.35vw rgba(0, 0, 0, 0.22));
        }

        .cloud-outer-layer {
            position: absolute;
            inset: 0;
            z-index: 1;

            background-color: #ffffff;

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-size: contain;
            mask-size: contain;

            pointer-events: none;
        }

        .cloud-video-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;

            width: 96%;
            height: 96%;

            overflow: hidden;

            transform: translate(-50%, -50%);

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-size: contain;
            mask-size: contain;

            pointer-events: none;
        }

        /* Cloud 2 */
        .cloud-type-2 .cloud-outer-layer,
        .cloud-type-2 .cloud-video-mask {
            -webkit-mask-image:

        .cloud-video-mask video {

            height: 100%;

            object-position: center;

            pointer-events: none;

        .cloud-video-mask video.video-wide {

            height: 100%;

            object-position: center;

    <script src="./assets/js/swiper-bundle.min.js"></script>
    <script src="./assets/js/djp.js"></script>
    <script>
        window.addEventListener("load", function () {
            const swiperElement =
                document.querySelector(".grateful-swiper");

            const previousButton =
                document.querySelector(".swiper-prev-btn");

            const nextButton =
                document.querySelector(".swiper-next-btn");

            const paginationElement =
                document.querySelector(".swiper-pagination");

            const pranamLink =
                document.querySelector(".pranam-link");

            if (typeof Swiper === "undefined") {
                console.error(
                    "Swiper is not loaded. Check this path: " +
                    "./assets/js/swiper-bundle.min.js"
                );

                return;
            }

            if (!swiperElement) {
                console.error(
                    "The .grateful-swiper element was not found."
                );

                return;
            }

            const gratefulSwiper = new Swiper(
                swiperElement,
                {
                    direction: "vertical",

                    slidesPerView: 1,
                    slidesPerGroup: 1,

                    spaceBetween: 0,

                    speed: 700,

                    loop: false,

                    initialSlide: 0,

                    allowTouchMove: true,
                    simulateTouch: true,

                    threshold: 5,

                    resistance: true,
                    resistanceRatio: 0.85,

                    touchStartPreventDefault: false,
                    touchMoveStopPropagation: false,

                    preventClicks: false,
                    preventClicksPropagation: false,

                    observer: true,
                    observeParents: true,
                    resizeObserver: true,
                    updateOnWindowResize: true,
                    watchOverflow: true,

                    mousewheel: {
                        enabled: true,
                        forceToAxis: true,
                        sensitivity: 1,
                        releaseOnEdges: true
                    },

                    keyboard: {
                        enabled: true,
                        onlyInViewport: true,
                        pageUpDown: true
                    },

                    navigation: {
                        nextEl: nextButton,
                        prevEl: previousButton
                    },

                    pagination: {
                        el: paginationElement,
                        clickable: true,

                        renderBullet: function (
                            index,
                            className
                        ) {
                            return (
                                '<span class="' +
                                className +
                                '">' +
                                (index + 1) +
                                "</span>"
                            );
                        }
                    },

                    on: {
                        init: function () {
                            controlSlideVideos(this);
                            updatePranamLink(this);
                        },

                        slideChange: function () {
                            updatePranamLink(this);
                        },

                        slideChangeTransitionEnd: function () {
                            controlSlideVideos(this);
                            updatePranamLink(this);
                        }
                    }
                }
            );

            function updatePranamLink(swiper) {
                if (!pranamLink) {
                    return;
                }

                const isLastSlide =
                    swiper.activeIndex === swiper.slides.length - 1;

                pranamLink.classList.toggle("show", isLastSlide);
            }

            function controlSlideVideos(swiper) {
                const allVideos =
                    swiperElement.querySelectorAll("video");

                allVideos.forEach(function (video) {
                    video.pause();
                });

                const activeSlide =
                    swiper.slides[swiper.activeIndex];

                if (!activeSlide) {
                    return;
                }

                const activeVideos =
                    activeSlide.querySelectorAll("video");

                activeVideos.forEach(function (video) {
                    video.currentTime = 0;

                    video.play().catch(function () {
                        console.warn(
                            "The browser prevented video playback."
                        );
                    });
                });
            }

            requestAnimationFrame(function () {
                gratefulSwiper.update();
            });

            setTimeout(function () {
                gratefulSwiper.update();
            }, 200);
        });
    </script>

    <!-- Audio Feedback JavaScript -->
    <script>
        (function () {
            // Preload audio instances
            const popAudio = new Audio("./assets/audio/pop.mp3");
            const topicAudio = new Audio("./assets/audio/topic.mp3");
            const swipeAudio = new Audio("./assets/audio/swipe.mp3");

            popAudio.preload = "auto";
            topicAudio.preload = "auto";
            swipeAudio.preload = "auto";

            // Debug logging so you can see in DevTools > Console
            // exactly why a sound failed (404, blocked, etc.)
            popAudio.addEventListener("error", function () {
                console.error(
                    "pop.mp3 failed to load. Check that " +
                    "./assets/audio/pop.mp3 exists and the filename/case is exact."
                );
            });
            topicAudio.addEventListener("error", function () {
                console.error(
                    "topic.mp3 failed to load. Check that " +
                    "./assets/audio/topic.mp3 exists and the filename/case is exact."
                );
            });
            swipeAudio.addEventListener("error", function () {
                console.error(
                    "swipe.mp3 failed to load. Check that " +
                    "./assets/audio/swipe.mp3 exists and the filename/case is exact."
                );
            });

            /**
             * Plays an audio clip and delays navigation for a link
             * so the sound isn't cut off by the page change.
             * Navigation always happens (even if audio fails) so a
             * broken/missing sound file never blocks the user.
             */
            function playThenNavigate(e, audio, href, delay) {
                e.preventDefault();

                let navigated = false;

                function goNow() {
                    if (navigated) return;
                    navigated = true;
                    window.location.href = href;
                }

                try {
                    audio.currentTime = 0;

                    const playPromise = audio.play();

                    if (playPromise && typeof playPromise.catch === "function") {
                        playPromise.catch(function (err) {
                            console.warn(
                                "Audio playback was blocked or failed:",
                                err
                            );
                            // Navigate immediately if audio can't play at all.
                            goNow();
                        });
                    }
                } catch (err) {
                    console.warn("Audio playback error:", err);
                    goNow();
                }

                setTimeout(goNow, delay);
            }

            function playSound(audio) {
                try {
                    audio.currentTime = 0;

                    const playPromise = audio.play();

                    if (playPromise && typeof playPromise.catch === "function") {
                        playPromise.catch(function (err) {
                            console.warn(
                                "Audio playback was blocked or failed:",
                                err
                            );
                        });
                    }
                } catch (err) {
                    console.warn("Audio playback error:", err);
                }
            }

            // Home button -> pop.mp3
            const homeBtn = document.querySelector(".home-btn");
            if (homeBtn) {
                homeBtn.addEventListener("click", function (e) {
                    playThenNavigate(e, popAudio, homeBtn.getAttribute("href"), 250);
                });
            } else {
                console.warn("No element with class .home-btn was found.");
            }

            // Topic pages (page-1, page-2, page-3) -> topic.mp3
            const pageLinks = document.querySelectorAll(".pages .page");
            pageLinks.forEach(function (link) {
                link.addEventListener("click", function (e) {
                    playThenNavigate(e, topicAudio, link.getAttribute("href"), 250);
                });
            });

            // Language navigation buttons -> swipe.mp3
            const langButtons = document.querySelectorAll(
                ".language-container .english, .language-container .hindi, .language-container .gujrati"
            );
            langButtons.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    playSound(swipeAudio);
                });
            });

            // Swiper prev/next navigation buttons -> swipe.mp3
            const swiperNavButtons = document.querySelectorAll(
                ".swiper-prev-btn, .swiper-next-btn"
            );
            swiperNavButtons.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    playSound(swipeAudio);
                });
            });
        })();
    </script>
